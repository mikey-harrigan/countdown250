<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Rock Legends Jam Session — once in a lifetime — July 3 Countdown 250 Ball">
  <defs>
    <radialGradient id="bg" cx="50%" cy="100%" r="85%">
      <stop offset="0%" stop-color="#4a0a0a"/>
      <stop offset="35%" stop-color="#1a0000"/>
      <stop offset="75%" stop-color="#0a0612"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="32%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4d03f"/>
      <stop offset="100%" stop-color="#b8881a"/>
    </linearGradient>
    <linearGradient id="redBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3030" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff3030" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="whiteBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="footGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff2828" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff2828" stop-opacity="0"/>
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Stage light beams -->
  <g>
    <rect x="195" y="-50" width="6" height="700" fill="url(#redBeam)" transform="rotate(8 200 0)"/>
    <rect x="396" y="-50" width="8" height="700" fill="url(#whiteBeam)"/>
    <rect x="598" y="-50" width="6" height="700" fill="url(#goldBeam)" transform="rotate(-8 600 0)"/>
  </g>

  <!-- Spotlight halo -->
  <rect width="800" height="600" fill="url(#spot)"/>

  <!-- Footlight glow -->
  <rect x="0" y="380" width="800" height="220" fill="url(#footGlow)"/>

  <!-- Once In A Lifetime eyebrow -->
  <text x="400" y="155" text-anchor="middle" font-family="Impact, 'Arial Black', system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="8" fill="#ff3030">&#9733; ONCE IN A LIFETIME &#9733;</text>

  <!-- ROCK LEGENDS — red glow underlayer -->
  <text x="400" y="295" text-anchor="middle" font-family="Impact, 'Arial Black', system-ui, sans-serif" font-size="115" font-weight="900" fill="#ff2828" filter="url(#redGlow)" letter-spacing="-3">ROCK LEGENDS</text>

  <!-- ROCK LEGENDS — main white -->
  <text x="400" y="295" text-anchor="middle" font-family="Impact, 'Arial Black', system-ui, sans-serif" font-size="115" font-weight="900" fill="#ffffff" letter-spacing="-3">ROCK LEGENDS</text>

  <!-- Jam Session -->
  <text x="400" y="395" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-style="italic" font-weight="bold" fill="url(#gold)" letter-spacing="2">Jam Session</text>

  <!-- Divider -->
  <line x1="320" y1="455" x2="480" y2="455" stroke="#d4a017" stroke-width="1" opacity="0.55"/>

  <!-- Date / venue -->
  <text x="400" y="500" text-anchor="middle" font-family="Impact, 'Arial Black', system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="6" opacity="0.85">JULY 3 &#183; COUNTDOWN 250 BALL</text>
</svg>
